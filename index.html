<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kashika's Study Tracker</title>
<style>
  :root{
    color-scheme: light;
    --bg:#f6f7fb; --card:#ffffff; --ink:#1f2430; --muted:#6b7280;
    --line:#e6e8ef; --accent:#4f46e5; --accent-soft:#eef0ff;
    --done:#16a34a; --amber:#b45309; --amber-soft:#fef3e2; --rose:#9f1239; --rose-soft:#ffe4ec;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.45}
  .wrap{max-width:900px;margin:0 auto;padding:22px 16px 64px}
  h1{font-size:24px;margin:0}
  .sub{color:var(--muted);font-size:13px}

  .hero{display:flex;align-items:center;gap:16px;margin:20px 0 26px;padding:20px 22px;
    background:linear-gradient(135deg,#4f46e5,#6d5ef7);color:#fff;border-radius:16px;text-decoration:none;
    box-shadow:0 10px 26px rgba(79,70,229,.25)}
  .hero .ic{width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.18);border-radius:12px}
  .hero h2{margin:0;font-size:18px}
  .hero p{margin:2px 0 0;font-size:13px;opacity:.9}
  .hero .go{margin-left:auto;font-size:22px}

  .section-h{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:24px 0 12px}

  .card{display:flex;gap:16px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:14px 16px;margin-bottom:12px;text-decoration:none;color:inherit;transition:box-shadow .15s}
  a.card:hover{box-shadow:0 8px 20px rgba(20,20,40,.08)}
  .card.next{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .datebox{flex:none;width:58px;text-align:center;border-radius:10px;padding:8px 4px;background:var(--accent-soft);color:var(--accent)}
  .datebox .d{font-size:20px;font-weight:800;line-height:1}
  .datebox .m{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
  .datebox .y{font-size:10px;opacity:.75}
  .body{flex:1;min-width:0}
  .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .subj{font-weight:700;font-size:15px}
  .badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
  .badge.exam{background:var(--amber-soft);color:var(--amber)}
  .badge.pre{background:var(--rose-soft);color:var(--rose)}
  .nextpill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--accent);color:#fff}
  .scope{color:var(--muted);font-size:12.5px;margin-top:5px}
  .cta{flex:none;align-self:center;font-size:13px;font-weight:600;color:var(--accent);white-space:nowrap}
  .cta.soon{color:var(--muted);font-weight:500}
  .arrow{font-size:16px;margin-left:3px}

  details.past{margin-top:8px}
  details.past summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.05em;list-style:none;padding:8px 0}
  details.past summary::-webkit-details-marker{display:none}
  details.past summary::before{content:"\25B8  ";}
  details.past[open] summary::before{content:"\25BE  ";}
  .card.done{opacity:.55}
  .card.done .datebox{background:#eef0f5;color:var(--muted)}

  .foot{color:var(--muted);font-size:12px;margin-top:26px;text-align:center}

  /* to-do */
  .todo{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 26px}
  .todo h3{margin:0 0 12px;font-size:15px;font-weight:700}
  .td-add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .td-add input[type=text]{flex:1;min-width:160px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit}
  .td-add input[type=date]{padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;color:var(--muted)}
  .td-add select{padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card)}
  .td-add button{padding:9px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}
  .td-item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line)}
  .td-item:first-child{border-top:none}
  .td-item.done{opacity:.5}
  .td-item.done .td-text{text-decoration:line-through}
  .td-cb{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex:none}
  .td-text{flex:1;font-size:14px;word-break:break-word}
  .td-chip{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
  .td-chip.homework{background:#e0edff;color:#1d4ed8}
  .td-chip.tuition{background:#efe4ff;color:#7c3aed}
  .td-chip.selfgoal{background:#e7f6ec;color:#16a34a}
  .td-chip.target{background:#fef3e2;color:#b45309}
  .td-due{font-size:11px;color:var(--muted);white-space:nowrap}
  .td-due.today{color:var(--accent);font-weight:700}
  .td-due.over{color:#b42318;font-weight:700}
  .td-del{border:none;background:none;color:var(--muted);cursor:pointer;font-size:17px;line-height:1;flex:none}
  .td-empty{color:var(--muted);font-size:13px;padding:6px 2px}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1 id="title">Kashika's Study Tracker</h1>
    <div class="sub">CBSE Class 10 · 2026&ndash;27</div>
  </div>

  <a class="hero" href="./full-syllabus.html">
    <span class="ic">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    </span>
    <div>
      <h2>Full Syllabus Tracker</h2>
      <p>Whole-year progress across every subject and chapter</p>
    </div>
    <span class="go">&rarr;</span>
  </a>

  <div class="todo" id="todoGeneral"></div>

  <div id="upcoming"></div>

  <details class="past">
    <summary>Completed &amp; past exams</summary>
    <div id="past"></div>
  </details>

  <div class="foot" id="foot"></div>
</div>

<script>
// Edit this list as the year progresses: set "slug"+ready:true once a tracker
// exists, adjust dates if the teacher changes them. "start"/"end" drive sorting
// and whether an exam is upcoming or past. "type" picks the badge colour.
const EXAMS = [
  { type:"Weekly Test", term:"Cycle II", subject:"English", start:"2026-07-20", end:"2026-07-20",
    slug:"weekly-cycle2-english", ready:false, scope:"English weekly test" },
  { type:"Weekly Test", term:"Cycle II", subject:"Social Science", start:"2026-07-27", end:"2026-07-27",
    slug:"weekly-cycle2-sst", ready:true,
    scope:"History: Nationalism in Europe (till pg 4), Making of a Global World (till pg 56) &middot; Geography: Water Resources, Agriculture (partly) &middot; Pol Science: Federalism (decentralisation), Gender Religion &amp; Caste (till pg 35) &middot; Economics: Sectors of the Indian Economy (till pg 29) &middot; Maps: Major Crops" },
  { type:"Weekly Test", term:"Cycle II", subject:"Science", start:"2026-08-03", end:"2026-08-03",
    slug:"weekly-cycle2-science", ready:true,
    scope:"Physics: Reflection &amp; Refraction (partly), Human Eye (partly) &middot; Chemistry: Acids, Bases &amp; Salts (partly) &middot; Biology: Life Processes (partly), Control &amp; Coordination (partly)" },
  { type:"Weekly Test", term:"Cycle II", subject:"Hindi", start:"2026-08-10", end:"2026-08-10",
    slug:"weekly-cycle2-hindi", ready:true, scope:"पाठ: मीरा के पद, तताँरा-वामीरो कथा &middot; व्याकरण/लेखन: अनुच्छेद, अपठित गद्यांश, पदबंध, सूचना लेखन" },
  { type:"Weekly Test", term:"Cycle II", subject:"Maths", start:"2026-08-17", end:"2026-08-17",
    slug:"weekly-cycle2-maths", ready:true, scope:"Triangles, Statistics, Areas Related to Circles" },

  { type:"Semester Exam", term:"Semester I", subject:"All subjects", start:"2026-09-19", end:"2026-10-01",
    slug:"mid-sem-term1-all", ready:false, scope:"Semester I Examination &middot; 19 Sep &ndash; 1 Oct 2026" },

  { type:"Weekly Test", term:"Cycle III", subject:"English", start:"2026-10-23", end:"2026-10-23",
    slug:"weekly-cycle3-english", ready:true, scope:"Comprehension, Formal Letter &amp; Factual Description, Integrated Grammar, Virtually True" },
  { type:"Weekly Test", term:"Cycle III", subject:"Maths", start:"2026-10-27", end:"2026-10-27",
    slug:"weekly-cycle3-maths", ready:true, scope:"Quadratic Equations, Arithmetic Progressions, Some Applications of Trigonometry" },
  { type:"Weekly Test", term:"Cycle III", subject:"Science", start:"2026-11-02", end:"2026-11-02",
    slug:"weekly-cycle3-science", ready:true,
    scope:"Physics: Electricity (partly), Magnetic Effects (partly) &middot; Chemistry: Metals &amp; Non-metals (partly), Carbon &amp; its Compounds (partly) &middot; Biology: How do Organisms Reproduce (sexual), Heredity (partly)" },
  { type:"Weekly Test", term:"Cycle III", subject:"Hindi", start:"2026-11-16", end:"2026-11-16",
    slug:"weekly-cycle3-hindi", ready:true, scope:"पाठ: पतझड़ में टूटी पत्तियाँ, पर्वत प्रदेश में पावस &middot; व्याकरण/लेखन: समास, लघुकथा लेखन, पत्रलेखन, वाक्य रूपांतरण" },
  { type:"Weekly Test", term:"Cycle III", subject:"Social Science", start:"2026-11-20", end:"2026-11-20",
    slug:"weekly-cycle3-sst", ready:true,
    scope:"History: Print Culture (partly) &middot; Pol Science: Gender Religion &amp; Caste (partly), Political Parties (partly) &middot; Geography: Mineral &amp; Energy Resources (partly) &middot; Economics: Money and Credit (partly)" },

  { type:"Pre-Board", term:"Pre-Board I", subject:"All subjects", start:"2026-12-04", end:"2026-12-17",
    slug:"pre-board-1-all", ready:false, scope:"Pre-Board I Examination &middot; 4 &ndash; 17 Dec 2026" },
  { type:"Pre-Board", term:"Pre-Board II", subject:"All subjects", start:"2026-12-28", end:"2027-01-12",
    slug:"pre-board-2-all", ready:false, scope:"Pre-Board II Examination &middot; 28 Dec 2026 &ndash; 12 Jan 2027" }
];

const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function today(){ const t=new Date(); t.setHours(0,0,0,0); return t; }
function d(s){ const p=s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function badgeClass(t){ return t==="Pre-Board"?"pre":(t==="Semester Exam"?"exam":""); }
function daysTo(dt){ return Math.round((dt-today())/86400000); }
function daysToLabel(s){ const n=daysTo(s); if(n===0)return "today"; if(n===1)return "tomorrow"; if(n>1)return "in "+n+" days"; return ""; }

function card(ex,isNext){
  const s=d(ex.start);
  const cls="card"+(isNext?" next":"")+((daysTo(d(ex.end))<0)?" done":"");
  const inner=
    `<div class="datebox"><div class="d">${s.getDate()}</div><div class="m">${MONTHS[s.getMonth()]}</div><div class="y">${s.getFullYear()}</div></div>`+
    `<div class="body"><div class="row1">`+
      `<span class="subj">${ex.subject}</span>`+
      `<span class="badge ${badgeClass(ex.type)}">${ex.type} &middot; ${ex.term}</span>`+
      (isNext?`<span class="nextpill">NEXT &middot; ${daysToLabel(s)}</span>`:``)+
    `</div><div class="scope">${ex.scope||""}</div></div>`+
    (ex.ready?`<span class="cta">Open tracker<span class="arrow">&rarr;</span></span>`:`<span class="cta soon">Coming soon</span>`);
  if(ex.ready) return `<a class="${cls}" href="./test-tracker/${ex.slug}.html">${inner}</a>`;
  return `<div class="${cls}">${inner}</div>`;
}

function render(){
  const upcoming=EXAMS.filter(e=>daysTo(d(e.end))>=0).sort((a,b)=>d(a.start)-d(b.start));
  const past=EXAMS.filter(e=>daysTo(d(e.end))<0).sort((a,b)=>d(b.start)-d(a.start));
  document.getElementById('upcoming').innerHTML =
    `<div class="section-h">Upcoming exams</div>` +
    (upcoming.length? upcoming.map((e,i)=>card(e,i===0)).join('') : `<div class="sub">No upcoming exams listed.</div>`);
  document.getElementById('past').innerHTML = past.length? past.map(e=>card(e,false)).join('') : `<div class="sub">None yet.</div>`;
  document.getElementById('foot').textContent = upcoming.length+" upcoming · "+past.length+" completed · tap an exam to open its tracker";
}
render();

// --- Daily to-do (own Firebase node, independent of the trackers) ---
const TODO_DB = "https://study-tracker-96b2a-default-rtdb.firebaseio.com/";
function initTodo(opts){
  const dbUrl=opts.dbUrl||null, listId=opts.listId, mount=document.getElementById(opts.mountId);
  if(!mount) return;
  const title=opts.title||"To-Do", CATS=opts.cats||["Self-goal","Homework","Tuition","Target"];
  const KEY="todo::"+listId, url=dbUrl? dbUrl.replace(/\/+$/,'')+"/todos/"+encodeURIComponent(listId)+".json":null;
  const chipClass={"Homework":"homework","Tuition":"tuition","Self-goal":"selfgoal","Target":"target"};
  let items=[]; try{const r=localStorage.getItem(KEY); if(r)items=JSON.parse(r);}catch(e){}
  let pushT=null;
  function persist(){ try{localStorage.setItem(KEY,JSON.stringify(items));}catch(e){}
    if(url){clearTimeout(pushT);pushT=setTimeout(()=>{fetch(url,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(items)}).catch(()=>{});},500);} }
  async function load(){ if(url){try{const r=await fetch(url,{cache:'no-store'}); if(r.ok){const dd=await r.json(); if(Array.isArray(dd)){items=dd; try{localStorage.setItem(KEY,JSON.stringify(items));}catch(e){}}}}catch(e){}} render2(); }
  function today(){const t=new Date();t.setHours(0,0,0,0);return t;}
  function fmtDue(dstr){ if(!dstr)return null; const dt=new Date(dstr+"T00:00:00"); const diff=Math.round((dt-today())/86400000);
    let cls="",lbl=dt.toLocaleDateString(undefined,{day:'numeric',month:'short'}); if(diff<0)cls="over"; else if(diff===0){cls="today";lbl="Today";} else if(diff===1)lbl="Tomorrow"; return {cls,lbl}; }
  function sorted(){ return items.slice().sort((a,b)=>{ if(a.done!==b.done)return a.done?1:-1; const ad=a.d||"9999-99",bd=b.d||"9999-99"; return ad<bd?-1:ad>bd?1:0; }); }
  function render2(){
    mount.innerHTML="";
    const h=document.createElement("h3"); h.textContent=title; mount.appendChild(h);
    const row=document.createElement("div"); row.className="td-add";
    const inp=document.createElement("input"); inp.type="text"; inp.placeholder="Add a task…";
    const sel=document.createElement("select"); CATS.forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;sel.appendChild(o);});
    const due=document.createElement("input"); due.type="date";
    const btn=document.createElement("button"); btn.textContent="Add";
    function addNow(){ if(!inp.value.trim())return; items.push({id:Date.now()+""+Math.random().toString(36).slice(2,6),t:inp.value.trim(),c:sel.value,d:due.value,done:false}); inp.value="";due.value=""; persist(); render2(); }
    btn.addEventListener("click",addNow); inp.addEventListener("keydown",e=>{if(e.key==="Enter")addNow();});
    row.append(inp,sel,due,btn); mount.appendChild(row);
    const list=document.createElement("div"); const arr=sorted();
    if(!arr.length){const e=document.createElement("div");e.className="td-empty";e.textContent="No tasks yet — add homework, tuition work, or a prep goal above.";list.appendChild(e);}
    arr.forEach(it=>{
      const el=document.createElement("div"); el.className="td-item"+(it.done?" done":"");
      const cb=document.createElement("input");cb.type="checkbox";cb.className="td-cb";cb.checked=it.done;
      cb.addEventListener("change",()=>{it.done=cb.checked;persist();render2();});
      const tx=document.createElement("span");tx.className="td-text";tx.textContent=it.t;
      el.append(cb,tx);
      if(it.c){const ch=document.createElement("span");ch.className="td-chip "+(chipClass[it.c]||"");ch.textContent=it.c;el.appendChild(ch);}
      const fd=fmtDue(it.d); if(fd){const dv=document.createElement("span");dv.className="td-due "+fd.cls;dv.textContent=fd.lbl;el.appendChild(dv);}
      const del=document.createElement("button");del.className="td-del";del.innerHTML="&times;";del.title="Delete";
      del.addEventListener("click",()=>{items=items.filter(x=>x.id!==it.id);persist();render2();});
      el.appendChild(del); list.appendChild(el);
    });
    mount.appendChild(list);
  }
  render2(); load();
}
initTodo({ dbUrl: TODO_DB, listId:"general", mountId:"todoGeneral", title:"To-Do" });
</script>
</body>
</html>
